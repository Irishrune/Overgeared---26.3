name: Import Phase 9 source and run first Fabric 26.3 compile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-phase9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Rebuild Phase 9 from pinned upstream commit
        run: python3 tools/import_phase9.py --repo .
      - name: Verify imported source and run isolated regression checks
        run: |
          python3 port-tests/run.py
          python3 -m unittest discover -s port-tests -p 'test_*.py' -v
          python3 tools/generate_263_assets.py --check
      - name: Commit full source to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import full Overgeared Phase 9 port source [port-source imported]'
            git push origin HEAD:main
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Fabric 26.3 port (diagnostic build)
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :fabric:compileJava --console=plain --stacktrace 2>&1 | tee compile-26.3.log
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-compile-26.3-log
          path: compile-26.3.log
          if-no-files-found: ignore
