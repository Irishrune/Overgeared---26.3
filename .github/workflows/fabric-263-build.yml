name: Fabric 26.3 build and game tests
on:
  push:
    branches: [main]
    paths-ignore:
      - 'porting/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out port source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run independent source regression tests
        shell: bash
        run: |
          set -o pipefail
          python port-tests/run.py 2>&1 | tee source-tests.log
          python -m unittest discover -s port-tests -p 'test_*.py' -v 2>&1 | tee -a source-tests.log
          python tools/check_263_namespaces.py 2>&1 | tee -a source-tests.log
          python tools/generate_263_assets.py --check 2>&1 | tee -a source-tests.log
          python tools/generate_263_gameplay.py --check 2>&1 | tee -a source-tests.log

      - name: Build the mod and run dedicated-server game tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :fabric:build :fabric:runGameTest --console=plain --stacktrace 2>&1 | tee compile-26.3.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-263-diagnostics
          path: |
            source-tests.log
            compile-26.3.log
            fabric/build/reports/
            fabric/build/gametest/
            fabric/run*/logs/
            fabric/build/run*/
          if-no-files-found: warn

      - name: Test client startup and workstation screens
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew :fabric:runClientGameTest --console=plain --stacktrace 2>&1 | tee client-26.3.log

      - name: Upload client test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-263-client-diagnostics
          path: |
            client-26.3.log
            fabric/build/run*/
            fabric/build/gametest/
            fabric/run*/logs/
            fabric/run*/screenshots/

      - name: Upload tested Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: overgeared-fabric-26.3
          path: fabric/build/libs/*.jar
